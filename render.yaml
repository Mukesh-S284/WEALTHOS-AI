# WealthOS AI — Render.com Blueprint Specification
# Deploys Managed PostgreSQL Database, FastAPI Backend, and Streamlit Frontend

databases:
  - name: wealthos-db
    databaseName: wealthos
    user: wealthos
    region: oregon
    plan: free

services:
  # 1. FastAPI Backend Service
  - type: web
    name: wealthos-backend
    runtime: python
    region: oregon
    plan: free
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wealthos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. Streamlit Frontend Service
  - type: web
    name: wealthos-frontend
    runtime: python
    region: oregon
    plan: free
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: wealthos-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: PYTHON_VERSION
        value: 3.11.9
